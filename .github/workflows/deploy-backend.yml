name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Required for Azure login via OIDC federated identity
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-master-architect-dev
  IMAGE_NAME: salacia-backend
  CONTEXT_PATH: src/backend
  AZURE_CONTAINER_REGISTRY: acramadev
  AZURE_CONTAINER_APP_NAME: aca-ama-backend

jobs:
  build-and-deploy:
    name: Build & deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ env.AZURE_CONTAINER_REGISTRY }}"

      - name: Build & push image to ACR
        run: |
          set -euo pipefail
          REGISTRY="${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io"
          IMAGE="$REGISTRY/${IMAGE_NAME}"
          TAG="${{ steps.vars.outputs.tag }}"

          docker build \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            "$CONTEXT_PATH"

          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

          echo "image=$IMAGE:$TAG" >> "$GITHUB_ENV"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.image }}
          targetPort: 3978
          ingress: external
          # Environment variables mirror src/backend/.env.
          # Non-secret defaults are inlined; secrets are pulled from
          # GitHub Actions secrets (configure them in repo Settings →
          # Secrets and variables → Actions). Empty values are valid;
          # the container will start but auth-dependent features will
          # fail until the secrets are populated.
          environmentVariables: >-
            PORT=3978
            AZURE_OPENAI_BASE_PATH=https://foundry-ama-dev.services.ai.azure.com/openai/deployments
            AZURE_OPENAI_DEPLOYMENT_NAME=gpt-5.4-mini
            AZURE_OPENAI_API_VERSION=2024-12-01-preview
            MICROSOFT_APP_ID=${{ secrets.MICROSOFT_APP_ID }}
            MICROSOFT_APP_PASSWORD=${{ secrets.MICROSOFT_APP_PASSWORD }}
            MICROSOFT_APP_TENANT_ID=${{ secrets.MICROSOFT_APP_TENANT_ID }}
            AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
            AZURE_CLIENT_ID=f552feab-c584-4c47-813a-64a0d1198f54
            AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Azure logout
        if: always()
        run: az logout
